{% extends 'base.html' %}

{% block auth_content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-icon">
            <i class="bi bi-robot"></i>
        </div>
        <h1>AI Agent</h1>
        <p class="login-subtitle">Your intelligent executive assistant</p>
        
        <div class="feature-list">
            <div class="feature-item"><i class="bi bi-envelope-check"></i> Smart email management</div>
            <div class="feature-item"><i class="bi bi-calendar-event"></i> Calendar intelligence</div>
            <div class="feature-item"><i class="bi bi-magic"></i> AI-powered replies</div>
        </div>
        
        <a href="/authorize" class="google-btn">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" width="20">
            Continue with Google
        </a>
        
        <p class="login-note">Only accesses Gmail & Calendar with your permission</p>
    </div>
</div>
{% endblock %}
