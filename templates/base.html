<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Agent{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    {% if user is defined and user %}
    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-robot"></i>
            <span>AI Agent</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item {% if request.path == '/dashboard' %}active{% endif %}">
                <i class="bi bi-grid-1x2"></i> Dashboard
            </a>
            <a href="/calendar" class="nav-item {% if request.path == '/calendar' %}active{% endif %}">
                <i class="bi bi-calendar3"></i> Calendar
            </a>
            <a href="/gmail" class="nav-item {% if request.path == '/gmail' %}active{% endif %}">
                <i class="bi bi-envelope"></i> Gmail
            </a>
            <a href="/assistant" class="nav-item {% if request.path == '/assistant' %}active{% endif %}">
                <i class="bi bi-chat-dots"></i> AI Assistant
            </a>
        </nav>
        <div class="sidebar-user">
            <img src="{{ user.picture }}" alt="profile" class="user-avatar">
            <div>
                <div class="user-name">{{ user.name }}</div>
                <a href="/logout" class="logout-link">Logout</a>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
    {% else %}
        {% block auth_content %}{% endblock %}
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
